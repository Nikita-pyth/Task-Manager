{% extends "base.html" %}
{% block content %}
  <h2>Projects</h2>
  <a href="{% url 'task_manager:project-create' %}" class="btn btn-success mb-3">+ Create Project</a>
  <ul class="list-group">
    {% for project in object_list %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ project.name }}
        <a href="{% url 'task_manager:project-detail' pk=project.pk %}" class="btn btn-sm btn-outline-primary">View</a>
      </li>
    {% empty %}
      <li class="list-group-item">No projects found.</li>
    {% endfor %}
  </ul>
{% endblock %}
