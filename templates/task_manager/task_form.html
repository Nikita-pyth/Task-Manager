{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h2>{% if object %}Edit Task{% else %}Create Task{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
{% endblock %}
