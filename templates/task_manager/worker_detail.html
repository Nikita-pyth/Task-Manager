{% extends "base.html" %}
{% block content %}
  <h2>{{ worker.first_name }} {{ worker.last_name }}</h2>
  <p><strong>Username:</strong> {{ worker.username }}</p>
  <p><strong>Email:</strong> {{ worker.email }}</p>
  <p><strong>Team:</strong> {{ worker.team.name }}</p>
  <p><strong>Position:</strong> {{ worker.position.name }}</p>
  <a href="{% url 'task_manager:worker-update' worker.pk %}">Edit</a> |
  <a href="{% url 'task_manager:worker-delete' worker.pk %}">Delete</a>
{% endblock %}
