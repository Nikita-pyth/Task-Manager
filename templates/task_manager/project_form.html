{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h2>{% if object %}Edit Project{% else %}Create Project{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    {% if project %}
      <a href="{% url 'task_manager:project-detail' pk=project.pk%}" class="btn btn-secondary">Cancel</a>
    {% else %}
      <a href="{% url 'task_manager:project-list' %}" class="btn btn-secondary">Cancel</a>
    {% endif %}
  </form>
{% endblock %}
