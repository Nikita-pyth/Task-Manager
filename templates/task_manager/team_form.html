{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h2>Create Team</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'task_manager:team-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
