{% extends "base.html" %}
{% block content %}
  <h2>Delete Worker</h2>
  <p>Are you sure you want to delete {{ object.username }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'task_manager:worker-detail' pk=worker.pk%}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
