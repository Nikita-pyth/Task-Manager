{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block sidebar %}
{% endblock %}
{% block content %}
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <br>
  <p>Don't have an account?</p>
  <a class="btn btn-secondary" href="{% url 'accounts:create' %}">Registration</a>
{% endblock %}
