{% extends "base.html" %}
{% block content %}
  <h2>{{ worker.first_name }} {{ worker.last_name }}</h2>
  <p><strong>Username:</strong> {{ worker.username }}</p>
  <p><strong>Email:</strong> {{ worker.email }}</p>
  <p><strong>Team:</strong> {{ worker.team.name }}</p>
  <p><strong>Position:</strong> {{ worker.position.name }}</p>
  <div class="d-flex gap-2 align-items-center">
    <a class="btn btn-outline-primary" href="{% url 'accounts:update' worker.pk %}">Edit</a>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-warning">Logout</button>
    </form>
    <a class="btn btn-outline-danger" href="{% url 'accounts:delete' worker.pk %}">Delete</a>
  </div>
{% endblock %}
