{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-header bg-body-secondary">
      <h2 class="mb-0 h5">{% if object %}Edit Project{% else %}Create Project{% endif %}</h2>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="d-flex flex-wrap gap-2 mt-3">
          <button type="submit" class="btn btn-primary">Save</button>

          {% if project %}
            <a href="{% url 'projects:detail' pk=project.pk %}" class="btn btn-secondary">Cancel</a>
          {% else %}
            <a href="{% url 'projects:list' %}" class="btn btn-secondary">Cancel</a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
{% endblock %}
