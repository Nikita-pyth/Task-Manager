{% extends "base.html" %}

{% block content %}
  <h2>Delete Team</h2>
  <p>Are you sure you want to delete the team "{{ team.name }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'teams:list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
