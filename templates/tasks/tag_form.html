{% extends "base.html" %}
{% load crispy_forms_filters %}
{% block content %}
  <h2>Create Tag</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Create</button>
    <button type="button" class="btn btn-secondary" onclick="history.back()">Cancel</button>
  </form>
{% endblock %}
